  /* sign-in */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate-card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 32px 28px; }
  .gate-card h1 { font-size: 24px; margin: 14px 0 4px; letter-spacing: .02em; }
  .gate-card p { margin: 0 0 20px; color: var(--ink-soft); font-size: 14px; }
  .gate-card label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 4px; }
  .gate-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); }
  .btn-main { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--tangerine); color: #fff; font-weight: 600; letter-spacing: .04em; }
  .btn-main:disabled { opacity: .6; }
  .err { color: #C2410C; font-size: 13px; min-height: 20px; margin-top: 10px; }

  /* app */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .top .who { margin-left: auto; color: var(--ink-soft); font-size: 13px; }
  .btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; padding: 7px 12px; font-size: 13px; }
  .btn:hover { border-color: var(--tangerine); }
  main.app { max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px; }

  /* the headline: the whole cohort as one bar */
  .cohort { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px; }
  .cohort-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cohort-head .big { font-size: 40px; font-weight: 700; line-height: 1; color: var(--tangerine); font-variant-numeric: tabular-nums; }
  .cohort-head .lbl { color: var(--ink-soft); }
  .cohort-head .upd { margin-left: auto; font-size: 12px; color: var(--ink-soft); }
  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--track); margin: 16px 0 12px; }
  .stack span { transition: width .5s ease; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--tangerine); background: var(--peach); }

  .tools { display: flex; gap: 10px; margin: 22px 0 10px; align-items: center; flex-wrap: wrap; }
  .tools input { flex: 1; min-width: 200px; max-width: 360px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); }
  .tools .sort { margin-left: auto; display: flex; gap: 6px; font-size: 13px; color: var(--ink-soft); align-items: center; }

  .tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-soft); padding: 12px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr.r { cursor: pointer; }
  tbody tr.r:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .name { font-weight: 600; }
  .mail { font-size: 12px; color: var(--ink-soft); }
  .status { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .s-done { color: var(--done); background: var(--done-bg); }
  .s-prog { color: var(--ember); background: var(--peach); }
  .s-stall { color: var(--warn); background: var(--warn-bg); }
  .s-none { color: var(--idle); background: var(--idle-bg); }
  .pct { display: flex; align-items: center; gap: 10px; min-width: 150px; }
  .pct .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .pct .bar span { display: block; height: 100%; background: var(--tangerine); }
  .pct b { font-size: 13px; width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

  /* chapter track: five cells, fill = slides seen, number = quiz score */
  .chs { display: flex; gap: 4px; }
  .ch { position: relative; width: 44px; height: 30px; border-radius: 6px; background: var(--track); overflow: hidden; display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ch .f { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--apricot); }
  .ch.full .f { background: var(--tangerine); }
  .ch em { position: relative; font-style: normal; }
  .ch.full em { color: #fff; }
  .ch em.low { color: #C2410C; }
  .ch.full em.low { color: #fff; text-decoration: underline; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  tr.d td { background: var(--bg); padding: 16px 20px 20px; }
  .det { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .det div { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 13px; }
  .det h4 { margin: 0 0 6px; font-size: 14px; }
  .det p { margin: 2px 0; color: var(--ink-soft); }
  .det p b { color: var(--ink); font-weight: 600; }

  .empty { padding: 48px 20px; text-align: center; color: var(--ink-soft); }
  .keynote { font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  @media (max-width: 640px) { .top-in, main.app { padding-left: 14px; padding-right: 14px; } .cohort-head .upd { margin-left: 0; width: 100%; } }
  @media (prefers-reduced-motion: reduce) { .stack span { transition: none; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="loginF" novalidate>
    <span class="logo" role="img" aria-label="星應 OrbitLabs"></span>
    <h1>入職訓練進度</h1>
    <p>管理後台，僅限授權管理者登入。</p>
    <label for="em">公司信箱</label>
    <input id="em" type="email" autocomplete="username" placeholder="name@orbitlabs.global">
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn-main" id="loginB" type="submit">登入</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <span class="logo" role="img" aria-label="星應 OrbitLabs"></span>
    <h1>入職訓練進度</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="refresh" type="button">重新整理</button>
    <button class="btn" id="csv" type="button">匯出 CSV</button>
    <button class="btn" id="out" type="button">登出</button>
  </div></header>

  <main class="app">
    <section class="cohort" aria-label="整體概況">
      <div class="cohort-head">
        <span class="big" id="doneN">0</span>
        <span class="lbl" id="doneL">位已完成訓練</span>
        <span class="upd" id="upd"></span>
      </div>
      <div class="stack" id="stack" role="img" aria-label="狀態分布"></div>
      <div class="legend" id="legend"></div>
    </section>

    <div class="tools">
      <input id="q" type="search" placeholder="搜尋姓名或信箱" aria-label="搜尋員工">
      <div class="sort">排序
        <button class="chip" data-sort="active" aria-pressed="true" type="button">最近活動</button>
        <button class="chip" data-sort="progress" aria-pressed="false" type="button">進度</button>
        <button class="chip" data-sort="name" aria-pressed="false" type="button">信箱</button>
      </div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>員工</th><th>狀態</th><th>整體進度</th>
          <th>章節（底色＝已看投影片，數字＝測驗分數）</th>
          <th>目前位置</th><th>最後活動</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">載入中…</td></tr></tbody>
      </table>
    </div>
    <p class="keynote">紅色分數代表低於 7 分。「停滯」指 7 天以上沒有活動且尚未完成。點擊任一列可查看詳細資料。</p>
  </main>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var people = [], filter = 'all', sortBy = 'active', open = {}, timer = null;
  var STALL_DAYS = 7, PASS = 7;

  var ST = {
    done:  { label: '已完成', cls: 's-done',  color: 'var(--done)' },
    prog:  { label: '進行中', cls: 's-prog',  color: 'var(--tangerine)' },
    stall: { label: '停滯',   cls: 's-stall', color: 'var(--warn)' },
    none:  { label: '尚未開始', cls: 's-none', color: 'var(--idle)' }
  };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(iso) {
    if (!iso) return '—';
    var m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return '剛剛'; if (m < 60) return m + ' 分鐘前';
    var h = Math.round(m / 60); if (h < 24) return h + ' 小時前';
    var d = Math.round(h / 24); if (d < 30) return d + ' 天前';
    return new Date(iso).toLocaleDateString('zh-TW');
  }
  function fmt(iso) { return iso ? new Date(iso).toLocaleString('zh-TW', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; }
  function chapterOf(i) {
    for (var k = 0; k < C.CHAPTERS.length; k++) if (i >= C.CHAPTERS[k].from && i <= C.CHAPTERS[k].to) return C.CHAPTERS[k].name;
    return i < C.CHAPTERS[0].from ? '開場' : '總結';
  }

  function build(roster, progress) {
    var byId = {}; progress.forEach(function (p) { byId[p.user_id] = p; });
    var quizzes = C.CHAPTERS.filter(function (c) { return c.quiz; });
    return roster.filter(function (u) { return !u.is_admin; }).map(function (u) {
      var p = byId[u.user_id] || null, seen = p ? p.visited || [] : [], set = {};
      seen.forEach(function (i) { set[i] = 1; });
      var chs = C.CHAPTERS.map(function (c) {
        var n = 0, tot = c.to - c.from + 1; for (var i = c.from; i <= c.to; i++) if (set[i]) n++;
        return { c: c, seen: n, tot: tot, q: p && c.quiz ? p.quiz[c.quiz] || null : null };
      });
      var pct = Math.round(seen.length / C.TOTAL_SLIDES * 100);
      var quizDone = quizzes.every(function (c) { return p && p.quiz && p.quiz[c.quiz]; });
      var status;
      if (!p || seen.length <= 2) status = 'none';
      else if (quizDone && pct >= 90) status = 'done';
      else if (Date.now() - new Date(p.last_active) > STALL_DAYS * 864e5) status = 'stall';
      else status = 'prog';
      return { id: u.user_id, email: u.email, name: u.email.split('@')[0], p: p, chs: chs, pct: pct, status: status,
               last: p ? p.last_active : null, lastSignIn: u.last_sign_in_at, created: u.created_at };
    });
  }

  function renderCohort() {
    var cnt = { done: 0, prog: 0, stall: 0, none: 0 }, n = people.length;
    people.forEach(function (x) { cnt[x.status]++; });
    $('doneN').textContent = cnt.done;
    $('doneL').textContent = '/ ' + n + ' 位已完成訓練';
    $('stack').innerHTML = ['done', 'prog', 'stall', 'none'].map(function (k) {
      return n && cnt[k] ? '<span style="width:' + (cnt[k] / n * 100) + '%;background:' + ST[k].color + '" title="' + ST[k].label + ' ' + cnt[k] + '"></span>' : '';
    }).join('');
    $('legend').innerHTML = '<button class="chip" type="button" data-f="all" aria-pressed="' + (filter === 'all') + '">全部 <b>' + n + '</b></button>' +
      ['done', 'prog', 'stall', 'none'].map(function (k) {
        return '<button class="chip" type="button" data-f="' + k + '" aria-pressed="' + (filter === k) + '"><i style="background:' + ST[k].color + '"></i>' + ST[k].label + ' <b>' + cnt[k] + '</b></button>';
      }).join('');
  }

  function chCell(x) {
    var r = x.seen / x.tot, full = r >= 0.999, q = x.q, txt = '', low = false;
    if (q) { txt = q.best; low = q.best < PASS; } else if (x.c.quiz) txt = ''; else txt = full ? '✓' : '';
    var tip = x.c.name + '：已看 ' + x.seen + '/' + x.tot + ' 頁' + (x.c.quiz ? (q ? '，測驗最佳 ' + q.best + '/' + C.QUIZ_MAX + '（' + q.attempts + ' 次）' : '，尚未測驗') : '');
    return '<span class="ch' + (full ? ' full' : '') + '" title="' + esc(tip) + '"><span class="f" style="height:' + Math.round(r * 100) + '%"></span><em' + (low ? ' class="low"' : '') + '>' + txt + '</em></span>';
  }

  function detail(x) {
    return '<tr class="d"><td colspan="6"><div class="det">' +
      '<div><h4>帳號</h4><p>建立 <b>' + fmt(x.created) + '</b></p><p>首次進入訓練 <b>' + fmt(x.p && x.p.started_at) + '</b></p><p>最近登入 <b>' + fmt(x.lastSignIn) + '</b></p></div>' +
      x.chs.map(function (c) {
        var q = c.q;
        return '<div><h4>' + esc(c.c.name) + '</h4><p>投影片 <b>' + c.seen + ' / ' + c.tot + '</b></p>' +
          (c.c.quiz ? (q ? '<p>測驗 最佳 <b>' + q.best + '</b>，最近 <b>' + q.last + '</b>（共 ' + q.attempts + ' 次）</p><p>' + fmt(q.at) + '</p>' : '<p>測驗 <b>尚未完成</b></p>') : '<p>本章無測驗</p>') + '</div>';
      }).join('') + '</div></td></tr>';
  }

  function renderRows() {
    var q = $('q').value.trim().toLowerCase();
    var list = people.filter(function (x) { return (filter === 'all' || x.status === filter) && (!q || x.email.toLowerCase().indexOf(q) > -1); });
    list.sort(function (a, b) {
      if (sortBy === 'progress') return b.pct - a.pct;
      if (sortBy === 'name') return a.email.localeCompare(b.email);
      return (b.last ? new Date(b.last) : 0) - (a.last ? new Date(a.last) : 0);
    });
    if (!people.length) { $('rows').innerHTML = '<tr><td colspan="6" class="empty">還沒有員工帳號。到 Supabase → Authentication → Users 新增帳號後，就會出現在這裡。</td></tr>'; return; }
    if (!list.length) { $('rows').innerHTML = '<tr><td colspan="6" class="empty">沒有符合條件的員工。</td></tr>'; return; }
    $('rows').innerHTML = list.map(function (x) {
      var cur = x.p ? '第 ' + (x.p.current_slide + 1) + ' 頁 <span class="muted">' + esc(chapterOf(x.p.current_slide)) + '</span>' : '<span class="muted">—</span>';
      return '<tr class="r" data-id="' + x.id + '" tabindex="0" aria-expanded="' + !!open[x.id] + '">' +
        '<td><div class="name">' + esc(x.name) + '</div><div class="mail">' + esc(x.email) + '</div></td>' +
        '<td><span class="status ' + ST[x.status].cls + '">' + ST[x.status].label + '</span></td>' +
        '<td><div class="pct"><div class="bar"><span style="width:' + x.pct + '%"></span></div><b>' + x.pct + '%</b></div></td>' +
        '<td><div class="chs">' + x.chs.map(chCell).join('') + '</div></td>' +
        '<td>' + cur + '</td>' +
        '<td title="' + esc(fmt(x.last)) + '">' + ago(x.last) + '</td></tr>' + (open[x.id] ? detail(x) : '');
    }).join('');
  }

  function render() { renderCohort(); renderRows(); $('upd').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); }

  function load() {
    return Promise.all([sb.rpc('admin_roster'), sb.from('progress').select('*')]).then(function (r) {
      if (r[0].error) throw r[0].error;
      if (r[1].error) throw r[1].error;
      people = build(r[0].data || [], r[1].data || []);
      render();
    });
  }

  function csv() {
    var head = ['email', 'status', 'progress_pct', 'current_slide', 'last_active'];
    C.CHAPTERS.forEach(function (c) { head.push(c.id + '_slides_seen'); if (c.quiz) head.push(c.id + '_quiz_best', c.id + '_quiz_attempts'); });
    var lines = [head.join(',')].concat(people.map(function (x) {
      var row = [x.email, ST[x.status].label, x.pct, x.p ? x.p.current_slide + 1 : '', x.last || ''];
      x.chs.forEach(function (c) { row.push(c.seen + '/' + c.tot); if (c.c.quiz) row.push(c.q ? c.q.best : '', c.q ? c.q.attempts : ''); });
      return row.map(function (v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'onboarding-progress-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function enter(user) {
    $('gate').hidden = true; $('app').hidden = false; $('who').textContent = user.email;
    load().catch(function (e) {
      var denied = /not authorized/i.test(e.message || '');
      $('rows').innerHTML = '<tr><td colspan="6" class="empty">' + (denied ? '這個帳號沒有後台權限。請在 Supabase 的 admins 資料表加入你的信箱。' : '讀取資料失敗：' + esc(e.message || e)) + '</td></tr>';
    });
    clearInterval(timer); timer = setInterval(function () { if (document.visibilityState === 'visible') load().catch(function () {}); }, 60000);
  }
  function leave() { clearInterval(timer); $('app').hidden = true; $('gate').hidden = false; $('em').focus(); }

  $('loginF').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('em').value.trim().toLowerCase(), pw = $('pw').value;
    if (!email || !pw) { $('loginErr').textContent = '請輸入信箱和密碼。'; return; }
    $('loginB').disabled = true; $('loginErr').textContent = '';
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      $('loginB').disabled = false;
      if (r.error) { $('loginErr').textContent = '信箱或密碼不正確。'; return; }
      $('pw').value = ''; enter(r.data.user);
    });
  });
  $('out').addEventListener('click', function () { sb.auth.signOut().finally(leave); });
  $('refresh').addEventListener('click', function () { load().catch(function () {}); });
  $('csv').addEventListener('click', csv);
  $('q').addEventListener('input', renderRows);
  $('legend').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; render(); });
  document.querySelector('.sort').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]'); if (!b) return; sortBy = b.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    renderRows();
  });
  function toggle(tr) { var id = tr.dataset.id; open[id] = !open[id]; renderRows(); }
  $('rows').addEventListener('click', function (e) { var tr = e.target.closest('tr.r'); if (tr) toggle(tr); });
  $('rows').addEventListener('keydown', function (e) { var tr = e.target.closest('tr.r'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); } });

  sb.auth.getSession().then(function (r) { var s = r.data && r.data.session; if (s) enter(s.user); else leave(); });
})();
</script>
</body>
</html>
